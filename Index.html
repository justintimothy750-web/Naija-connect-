<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaijaConnect</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #008753;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 8px;
      font-size: 15px;
    }

    .container {
      padding: 25px 20px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #666;
      line-height: 1.5;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .category {
      background: white;
      padding: 22px 10px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-size: 16px;
    }

    .category span {
      display: block;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .button {
      display: block;
      width: 100%;
      background: #008753;
      color: white;
      text-align: center;
      padding: 15px;
      border-radius: 10px;
      margin-top: 25px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>NaijaConnect 🇳🇬</h1>
    <p>Connect. Discover. Grow.</p>
  </header>

  <div class="container">

    <div class="welcome">
      <h2>Welcome to NaijaConnect</h2>
      <p>
        Find trusted services around you and connect with
        people and businesses in your community.
      </p>
    </div>

    <input
      class="search"
      type="text"
      placeholder="Search for a service or business..."
    >

    <div class="categories">

      <div class="category">
        <span>💈</span>
        Barbers
      </div>

      <div class="category">
        <span>🍔</span>
        Food
      </div>

      <div class="category">
        <span>🔧</span>
        Mechanics
      </div>

      <div class="category">
        <span>👗</span>
        Tailors
      </div>

      <div class="category">
        <span>📱</span>
        Phone Repair
      </div>

      <div class="category">
        <span>📸</span>
        Photography
      </div>

    </div>

    <a href="#" class="button">Get Started</a>

  </div>

</body>
</html>
